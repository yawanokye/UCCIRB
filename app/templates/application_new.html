{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><span class="eyebrow">New application</span><h1>Research information</h1><p>Create the record first, then upload the required documents before submission.</p></div></div><form method="post" class="card formgrid"><label class="wide">Research title<input name="title" required></label><label>College<select name="college_id" required>{% for c in colleges %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>Applicant type<select name="applicant_type"><option>Student</option><option>Staff</option><option>External Researcher</option></select></label><label>Department<input name="department"></label><label>Programme<input name="programme"></label><label class="wide">Brief study summary<textarea name="study_summary" rows="5"></textarea></label><div class="wide"><button class="btn">Create application</button></div></form>{% endblock %}
