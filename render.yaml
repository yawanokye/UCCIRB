services:
  - type: web
    name: ucc-irb-portal
    runtime: docker
    plan: starter
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ucc-irb-db
          property: connectionString

databases:
  - name: ucc-irb-db
    plan: starter
